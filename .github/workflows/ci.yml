name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential git perl libssl-dev curl wget zip unzip xz-utils libtinfo6

      - name: Setup Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install Linux Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/theos"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C toolchain/

      - name: Download SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
          TMP=$(mktemp -d)
          unzip -q master.zip -d "$TMP"
          mv "$TMP"/sdks-master/*.sdk ./
          rm -rf "$TMP" master.zip
          echo "THEOS_SDK=iPhoneOS15.6.sdk" >> $GITHUB_ENV

      - name: Tải Dobby (arm64) + header
        run: |
          mkdir -p lib
          cd lib
          curl -L -o dobby.tar.gz https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz
          tar -xzvf dobby.tar.gz
          cp build/iphoneos/arm64/libdobby.a ./
          cp build/iphoneos/dobby.h ./
          rm -rf dobby.tar.gz build
          ls -la

      - name: Build Tweak
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: 34306jit-DEB
          path: packages/*.deb
          retention-days: 7
