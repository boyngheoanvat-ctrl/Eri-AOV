name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Theos
      run: |
        git clone --depth=1 https://github.com/theos/theos.git theos
        export THEOS="$GITHUB_WORKSPACE/theos"
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Download iPhone SDKs
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos"
        git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
        ls -la "$THEOS/sdks/"

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential git libplist-dev libcurl4-openssl-dev

    - name: Build
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos"
        make clean
        make all
