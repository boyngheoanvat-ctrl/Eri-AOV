name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential git perl libssl-dev curl wget zip unzip xz-utils libtinfo6

      - name: Setup Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Install Linux Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/theos"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C toolchain/

      - name: Download SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          cd "$GITHUB_WORKSPACE/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ./
          rm -rf sdks-master sdks.zip

      - name: Build
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          export THEOS_SDK="iPhoneOS15.6.sdk"
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: 34306jit-deb
          path: packages/*.deb
          retention-days: 7

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 34306jit-dylib
          path: .theos/obj/**/*.dylib
          retention-days: 7
